<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawCare — Vaccinations</title>
    <link rel="stylesheet" href="../../css/shared.css">
    <style>
        .shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
        .vax-bar-wrap{display:flex;align-items:center;gap:8px}
        .vax-track{flex:1;height:8px;background:rgba(61,43,31,0.08);border-radius:20px;overflow:hidden;min-width:80px}
        .vax-fill{height:100%;border-radius:20px}
    </style>
</head>
<body>
<div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
        <div class="topbar">
            <div><div class="page-title">💉 Vaccinations</div><div class="page-sub">Track and manage dog vaccination records</div></div>
            <div class="topbar-right">
                <button class="btn btn-outline" onclick="sendAllReminders()">📧 Send All Reminders</button>
                <button class="btn btn-amber" onclick="openAdd()">+ Add Record</button>
            </div>
        </div>
        <div class="content">
            <div id="expiryAlert" class="alert-banner alert-warn fade-1" style="display:none">💉 <span id="expiryMsg"></span></div>

            <div class="stats-grid fade-1" style="grid-template-columns:repeat(4,1fr)">
                <div class="stat-card"><div class="stat-icon sky">💉</div><div><div class="stat-value" id="sc_total">0</div><div class="stat-label">Total Records</div></div></div>
                <div class="stat-card"><div class="stat-icon sage">✅</div><div><div class="stat-value" id="sc_valid">0</div><div class="stat-label">Valid</div></div></div>
                <div class="stat-card"><div class="stat-icon rust">⚠️</div><div><div class="stat-value" id="sc_expiring">0</div><div class="stat-label">Expiring Soon</div></div></div>
                <div class="stat-card"><div class="stat-icon rust">❌</div><div><div class="stat-value" id="sc_expired">0</div><div class="stat-label">Expired</div></div></div>
            </div>

            <div class="filter-bar fade-2">
                <button class="filter-chip active" onclick="setFilter(this,'ALL')">All</button>
                <button class="filter-chip" onclick="setFilter(this,'VALID')">✅ Valid</button>
                <button class="filter-chip" onclick="setFilter(this,'EXPIRING')">⚠️ Expiring (30d)</button>
                <button class="filter-chip" onclick="setFilter(this,'EXPIRED')">❌ Expired</button>
                <div class="filter-right">
                    <div class="search-wrap"><span class="search-icon">🔍</span><input class="search-input" id="searchInput" placeholder="Search dog or vaccine…" oninput="filterTable()"></div>
                </div>
            </div>

            <div class="table-wrap fade-3">
                <table>
                    <thead><tr><th>Dog</th><th>Vaccine</th><th>Date Given</th><th>Expiry Date</th><th>Validity</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="vaxTbody"></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="vaxModal" onclick="if(event.target===this)Modal.close('vaxModal')">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="modalTitle">💉 Add Vaccination Record</div>
            <button class="modal-close" onclick="Modal.close('vaxModal')">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="vaxId">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Dog</label>
                    <select id="f_dogId" class="form-control">
                        <option value="">Select dog…</option>
                        <option value="1">🐶 Buddy</option><option value="2">🐩 Luna</option>
                        <option value="3">🐕‍🦺 Max</option><option value="4">🦮 Coco</option>
                        <option value="5">🐶 Bella</option><option value="6">🐾 Rocky</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Vaccine Name</label>
                    <select id="f_vaccine" class="form-control">
                        <option value="Rabies">Rabies</option>
                        <option value="Distemper">Distemper</option>
                        <option value="Parvovirus">Parvovirus</option>
                        <option value="Bordetella">Bordetella</option>
                        <option value="Leptospirosis">Leptospirosis</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Date Given</label>
                    <input id="f_dateGiven" class="form-control" type="date">
                </div>
                <div class="form-group">
                    <label class="form-label">Expiry Date</label>
                    <input id="f_expiry" class="form-control" type="date">
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="Modal.close('vaxModal')">Cancel</button>
            <button class="btn btn-amber" onclick="saveVax()">💾 Save Record</button>
        </div>
    </div>
</div>

<script src="../js/shared.js"></script><script src="../js/sidebar.js"></script>
<script>
    injectSidebar('vaccinations.html');

    let vaxRecords = [
        {vaccinationId:1, dogId:1, dogName:'Buddy', vaccineName:'Rabies',      dateGiven:'2025-03-08', expiryDate:'2026-03-08'},
        {vaccinationId:2, dogId:1, dogName:'Buddy', vaccineName:'Distemper',   dateGiven:'2025-09-14', expiryDate:'2026-09-14'},
        {vaccinationId:3, dogId:2, dogName:'Luna',  vaccineName:'Rabies',      dateGiven:'2025-03-28', expiryDate:'2026-03-28'},
        {vaccinationId:4, dogId:3, dogName:'Max',   vaccineName:'Parvovirus',  dateGiven:'2025-06-15', expiryDate:'2026-06-15'},
        {vaccinationId:5, dogId:4, dogName:'Coco',  vaccineName:'Distemper',   dateGiven:'2025-03-05', expiryDate:'2026-03-17'},
        {vaccinationId:6, dogId:5, dogName:'Bella', vaccineName:'Rabies',      dateGiven:'2025-07-20', expiryDate:'2026-07-20'},
        {vaccinationId:7, dogId:6, dogName:'Rocky', vaccineName:'Bordetella',  dateGiven:'2025-04-10', expiryDate:'2026-04-10'},
    ];

    let filterStatus='ALL';

    function getVaxStatus(expiry) {
        const days=Math.ceil((new Date(expiry)-new Date())/(1000*60*60*24));
        if(days<0) return 'EXPIRED';
        if(days<=30) return 'EXPIRING';
        return 'VALID';
    }

    function vaxProgress(dateGiven, expiry) {
        const total=new Date(expiry)-new Date(dateGiven);
        const elapsed=new Date()-new Date(dateGiven);
        const pct=Math.max(0,Math.min(100,Math.round((elapsed/total)*100)));
        const color=pct>=95?'var(--rust)':pct>=70?'var(--amber)':'var(--sage)';
        return `<div class="vax-bar-wrap">
    <div class="vax-track"><div class="vax-fill" style="width:${pct}%;background:${color}"></div></div>
    <span style="font-size:11px;color:var(--text-muted)">${pct}%</span>
  </div>`;
    }

    function renderTable(data) {
        const tbody=document.getElementById('vaxTbody');
        if(!data.length){tbody.innerHTML='<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-muted);">No records found</td></tr>';return;}
        tbody.innerHTML=data.map(v=>{
            const st=getVaxStatus(v.expiryDate);
            const days=Math.ceil((new Date(v.expiryDate)-new Date())/(1000*60*60*24));
            const expiryDisplay=st==='EXPIRED'?`<span style="color:var(--rust);font-weight:700">❌ ${v.expiryDate}</span>`:
                st==='EXPIRING'?`<span style="color:var(--amber);font-weight:700">⚠️ ${v.expiryDate} (${days}d)</span>`:
                    `<span style="color:var(--sage)">${v.expiryDate}</span>`;
            const stBadge=st==='EXPIRED'?'badge-rust':st==='EXPIRING'?'badge-amber':'badge-green';
            const stLabel=st==='EXPIRED'?'❌ Expired':st==='EXPIRING'?'⚠️ Expiring':'✅ Valid';
            return `<tr>
      <td><strong>${v.dogName}</strong></td>
      <td><span class="badge badge-sky">💉 ${v.vaccineName}</span></td>
      <td>${v.dateGiven}</td>
      <td>${expiryDisplay}</td>
      <td>${vaxProgress(v.dateGiven,v.expiryDate)}</td>
      <td><span class="badge ${stBadge}">${stLabel}</span></td>
      <td><div class="td-actions">
        <button class="btn btn-sm btn-amber btn-icon" title="Notify Owner" onclick="notifyOwner(${v.vaccinationId})">📧</button>
        <button class="btn btn-sm btn-sky btn-icon" title="Edit" onclick="openEdit(${v.vaccinationId})">✏️</button>
        <button class="btn btn-sm btn-rust btn-icon" title="Delete" onclick="deleteVax(${v.vaccinationId})">🗑</button>
      </div></td>
    </tr>`;
        }).join('');
    }

    function filterTable(){
        const q=document.getElementById('searchInput').value.toLowerCase();
        let data=vaxRecords;
        if(filterStatus!=='ALL') data=data.filter(v=>getVaxStatus(v.expiryDate)===filterStatus);
        if(q) data=data.filter(v=>v.dogName.toLowerCase().includes(q)||v.vaccineName.toLowerCase().includes(q));
        renderTable(data);
    }

    function setFilter(el,f){filterStatus=f;document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');filterTable();}

    function openAdd(){
        document.getElementById('vaxId').value='';
        ['f_dogId','f_dateGiven','f_expiry'].forEach(id=>document.getElementById(id).value='');
        document.getElementById('f_dateGiven').valueAsDate=new Date();
        document.getElementById('modalTitle').textContent='💉 Add Vaccination Record';
        Modal.open('vaxModal');
    }

    function openEdit(id){
        const v=vaxRecords.find(x=>x.vaccinationId===id);if(!v)return;
        document.getElementById('vaxId').value=v.vaccinationId;
        document.getElementById('f_dogId').value=v.dogId;
        document.getElementById('f_vaccine').value=v.vaccineName;
        document.getElementById('f_dateGiven').value=v.dateGiven;
        document.getElementById('f_expiry').value=v.expiryDate;
        document.getElementById('modalTitle').textContent='✏️ Edit Record';
        Modal.open('vaxModal');
    }

    async function saveVax(){
        const id=document.getElementById('vaxId').value;
        const body={dogId:parseInt(document.getElementById('f_dogId').value)||0,vaccineName:document.getElementById('f_vaccine').value,dateGiven:document.getElementById('f_dateGiven').value,expiryDate:document.getElementById('f_expiry').value};
        if(!body.dogId){Toast.warn('Select a dog');return;}
        if(!body.expiryDate){Toast.warn('Enter expiry date');return;}
        try{if(id){body.vaccinationId=parseInt(id);await API.put('/vaccinations',body);}else{await API.post('/vaccinations',body);}}catch{}
        const dogNames={1:'Buddy',2:'Luna',3:'Max',4:'Coco',5:'Bella',6:'Rocky'};
        if(id){const idx=vaxRecords.findIndex(v=>v.vaccinationId===parseInt(id));if(idx>=0)vaxRecords[idx]={...vaxRecords[idx],...body,dogName:dogNames[body.dogId]||'Dog '+body.dogId};Toast.success('Record updated!');}
        else{body.vaccinationId=vaxRecords.length+1;body.dogName=dogNames[body.dogId]||'Dog '+body.dogId;vaxRecords.push(body);Toast.success('Record saved!');}
        Modal.close('vaxModal');filterTable();updateStats();
    }

    async function deleteVax(id){
        Modal.confirm('Delete this record?',async()=>{try{await API.delete('/vaccinations/'+id);}catch{}vaxRecords=vaxRecords.filter(v=>v.vaccinationId!==id);Toast.success('Deleted.');filterTable();updateStats();});
    }

    function notifyOwner(id){const v=vaxRecords.find(x=>x.vaccinationId===id);if(v)Toast.success(`📧 Reminder sent to ${v.dogName}'s owner!`);}
    function sendAllReminders(){const exp=vaxRecords.filter(v=>getVaxStatus(v.expiryDate)!=='VALID').length;Toast.success(`📧 Sent ${exp} vaccination reminders!`);}

    function updateStats(){
        document.getElementById('sc_total').textContent   = vaxRecords.length;
        document.getElementById('sc_valid').textContent   = vaxRecords.filter(v=>getVaxStatus(v.expiryDate)==='VALID').length;
        document.getElementById('sc_expiring').textContent= vaxRecords.filter(v=>getVaxStatus(v.expiryDate)==='EXPIRING').length;
        document.getElementById('sc_expired').textContent = vaxRecords.filter(v=>getVaxStatus(v.expiryDate)==='EXPIRED').length;
        const expCount=vaxRecords.filter(v=>getVaxStatus(v.expiryDate)!=='VALID').length;
        const alertEl=document.getElementById('expiryAlert');
        if(expCount>0){document.getElementById('expiryMsg').textContent=`${expCount} vaccination(s) are expiring or expired. Reminders should be sent to owners.`;alertEl.style.display='flex';}
        else alertEl.style.display='none';
    }

    filterTable();updateStats();
</script>
</body>
</html>
