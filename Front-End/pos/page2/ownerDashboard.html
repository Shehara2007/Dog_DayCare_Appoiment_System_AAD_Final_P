<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawCare — My Dashboard</title>
    <link rel="stylesheet" href="../../css/shared.css">
    <style>
        .shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
        .dog-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
        .my-dog-card{background:var(--white);border-radius:18px;box-shadow:0 2px 18px var(--shadow);overflow:hidden;transition:transform 0.2s;cursor:pointer;animation:fadeUp 0.4s ease both}
        .my-dog-card:hover{transform:translateY(-4px);box-shadow:0 10px 32px var(--shadow-deep)}
        .dog-hdr{height:80px;position:relative;display:flex;align-items:flex-end;padding:12px;justify-content:flex-end}
        .dog-emo{position:absolute;bottom:-20px;left:16px;width:52px;height:52px;background:var(--white);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 14px var(--shadow)}
        .dog-body{padding:28px 16px 16px}
        .dog-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:700}
        .dog-sub{font-size:11px;color:var(--text-muted);margin-bottom:10px}
        .dog-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
        .pill{padding:3px 9px;border-radius:12px;font-size:10px;font-weight:700}
        .dog-foot{display:flex;gap:6px;border-top:1px solid var(--warm);padding-top:12px}
        .dog-foot .btn{flex:1;justify-content:center;font-size:11px;padding:7px 6px}
        .appt-mini{background:var(--white);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 12px var(--shadow);border-left:4px solid;margin-bottom:10px;cursor:pointer;transition:background 0.15s}
        .appt-mini:hover{background:var(--cream)}
        .appt-mini.confirmed{border-color:var(--sage)}
        .appt-mini.pending{border-color:var(--amber)}
        .appt-mini.completed{border-color:var(--sky)}
        .appt-time-box{background:var(--warm);border-radius:10px;padding:8px 12px;text-align:center;min-width:56px}
        .appt-time-main{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;line-height:1}
        .appt-time-ampm{font-size:10px;color:var(--text-muted)}
        .notif-item{background:var(--white);border-radius:12px;padding:12px 16px;display:flex;align-items:flex-start;gap:12px;box-shadow:0 1px 10px var(--shadow);margin-bottom:8px;border-left:3px solid}
        .notif-item.warn{border-color:var(--amber)}
        .notif-item.error{border-color:var(--rust)}
        .notif-item.info{border-color:var(--sky)}
        .notif-icon{font-size:20px;flex-shrink:0;margin-top:2px}
        .notif-text{font-size:13px;font-weight:500}
        .notif-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
        .content-2col{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
    </style>
</head>
<body>
<div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main">
        <div class="topbar">
            <div>
                <div class="page-title">My Dashboard 🐾</div>
                <div class="page-sub" id="ownerGreeting">Welcome back!</div>
            </div>
            <div class="topbar-right">
                <button class="btn btn-amber" onclick="window.location.href='owner-appointments.html'">📅 Book Daycare</button>
                <button class="btn btn-primary" onclick="window.location.href='owner-doctor.html'">🩺 Book Doctor</button>
            </div>
        </div>
        <div class="content">
            <!-- Welcome hero -->
            <div style="background:linear-gradient(135deg,var(--bark) 0%,var(--bark-light) 100%);border-radius:20px;padding:26px 28px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;position:relative;overflow:hidden;" class="fade-1">
                <div style="position:absolute;right:20px;top:-10px;font-size:100px;opacity:0.06">🐾</div>
                <div>
                    <div style="font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:#fff" id="heroName">Hello, Pet Owner!</div>
                    <div style="font-size:13px;color:rgba(255,255,255,0.55);margin-top:4px">You have <strong style="color:var(--amber-light)" id="heroDogsCount">0</strong> registered dogs</div>
                </div>
                <div style="display:flex;gap:24px">
                    <div style="text-align:center"><div style="font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:var(--amber-light)" id="h_appts">0</div><div style="font-size:11px;color:rgba(255,255,255,0.4)">Appointments</div></div>
                    <div style="text-align:center"><div style="font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:var(--amber-light)" id="h_alerts">0</div><div style="font-size:11px;color:rgba(255,255,255,0.4)">Active Alerts</div></div>
                </div>
            </div>

            <!-- My Dogs -->
            <div class="flex-between mb-16 fade-2">
                <h2 class="font-serif" style="font-size:20px">My Dogs</h2>
                <a href="ownerDogProfiles.html" class="btn btn-outline btn-sm">View All →</a>
            </div>
            <div class="dog-cards mb-24 fade-2" id="myDogsGrid"></div>

            <div class="content-2col fade-3">
                <!-- Upcoming Appointments -->
                <div>
                    <div class="flex-between mb-16">
                        <h2 class="font-serif" style="font-size:20px">Upcoming Appointments</h2>
                        <a href="ownerAppointments.html" class="btn btn-outline btn-sm">All →</a>
                    </div>
                    <div id="upcomingAppts"></div>
                </div>
                <!-- Notifications -->
                <div>
                    <div class="flex-between mb-16">
                        <h2 class="font-serif" style="font-size:20px">🔔 Alerts</h2>
                    </div>
                    <div id="notifList"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="../js/shared.js"></script><script src="../js/sidebar.js"></script>
<script>
    injectSidebar('owner-dashboard.html');
    const user = Auth.getUser();
    document.getElementById('ownerGreeting').textContent = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
    document.getElementById('heroName').textContent = 'Hello, '+(user.fullName||'Pet Owner')+'! 👋';

    const myDogs = [
        {dogId:1,dogName:'Buddy', breed:'Golden Retriever',age:3,gender:'MALE',  behaviour:'FRIENDLY',healthStatus:'HEALTHY',     riskLevel:'LOW',  vaxExpiry:'2026-03-08',gradient:'linear-gradient(135deg,#F5DFA0,#E8C06C)',emoji:'🐶'},
        {dogId:2,dogName:'Luna',  breed:'Poodle',          age:2,gender:'FEMALE',behaviour:'ACTIVE',  healthStatus:'MINOR_ISSUE',  riskLevel:'MEDIUM',vaxExpiry:'2026-03-28',gradient:'linear-gradient(135deg,#F5A8A8,#E87070)',emoji:'🐩'},
    ];

    const riskTag = {LOW:'<span class="pill" style="background:rgba(122,158,126,0.12);color:#3A6B3E">🛡 Low Risk</span>',MEDIUM:'<span class="pill" style="background:rgba(212,130,10,0.1);color:#8B5E00">⚡ Med Risk</span>',HIGH:'<span class="pill" style="background:rgba(192,71,42,0.12);color:var(--rust)">🔥 High Risk</span>'};

    document.getElementById('heroDogsCount').textContent = myDogs.length;
    animateCount('h_appts',3); animateCount('h_alerts',2);

    document.getElementById('myDogsGrid').innerHTML = myDogs.map((d,i) => {
        const today=new Date(); const exp=new Date(d.vaxExpiry);
        const days=Math.ceil((exp-today)/(1000*60*60*24));
        const vaxText=days<=14?`<span class="pill" style="background:rgba(192,71,42,0.1);color:var(--rust)">⚠️ Vax ${days}d</span>`:
            `<span class="pill" style="background:rgba(122,158,126,0.1);color:#3A6B3E">💉 Vax OK</span>`;
        const hTag = d.healthStatus==='HEALTHY'?`<span class="pill" style="background:rgba(122,158,126,0.1);color:#3A6B3E">🟢 Healthy</span>`:
            `<span class="pill" style="background:rgba(192,71,42,0.1);color:var(--rust)">⚠️ ${d.healthStatus.replace('_',' ')}</span>`;
        return `<div class="my-dog-card" style="animation-delay:${i*0.1}s" onclick="window.location.href='owner-dogs.html'">
    <div class="dog-hdr" style="background:${d.gradient}">
      <div class="dog-emo">${d.emoji}</div>
    </div>
    <div class="dog-body">
      <div class="dog-name">${d.dogName}</div>
      <div class="dog-sub">${d.breed} · ${d.age} yrs · ${d.gender==='MALE'?'♂ Male':'♀ Female'}</div>
      <div class="dog-pills">${riskTag[d.riskLevel]} ${hTag} ${vaxText}</div>
      <div class="dog-foot">
        <button class="btn btn-outline" onclick="event.stopPropagation();window.location.href='owner-appointments.html'">📅 Book</button>
        <button class="btn btn-outline" onclick="event.stopPropagation();window.location.href='owner-doctor.html'">🩺 Vet</button>
        <button class="btn btn-primary" onclick="event.stopPropagation()">👁 Profile</button>
      </div>
    </div>
  </div>`;
    }).join('');

    const appts = [
        {time:'08:00',ampm:'AM',dog:'Buddy',type:'Full Day Daycare',status:'confirmed',color:'var(--sage)'},
        {time:'10:30',ampm:'AM',dog:'Luna',type:'Doctor — Dr. Fernando',status:'pending',color:'var(--amber)'},
        {time:'02:00',ampm:'PM',dog:'Buddy',type:'Bath & Grooming',status:'completed',color:'var(--sky)'},
    ];
    document.getElementById('upcomingAppts').innerHTML = appts.map(a=>`
  <div class="appt-mini ${a.status}">
    <div class="appt-time-box"><div class="appt-time-main">${a.time}</div><div class="appt-time-ampm">${a.ampm}</div></div>
    <div style="flex:1"><div style="font-weight:600;font-size:14px">🐶 ${a.dog}</div><div style="font-size:12px;color:var(--text-muted)">${a.type}</div></div>
    ${statusBadge(a.status.toUpperCase())}
  </div>`).join('');

    document.getElementById('notifList').innerHTML = `
  <div class="notif-item warn"><span class="notif-icon">💉</span><div><div class="notif-text">Buddy's Rabies vaccine expiring in 5 days</div><div class="notif-sub">Please renew before your next booking</div></div></div>
  <div class="notif-item error"><span class="notif-icon">📋</span><div><div class="notif-text">Luna's health report: Minor skin irritation</div><div class="notif-sub">Dr. Fernando recommends a checkup</div></div></div>
  <div class="notif-item info"><span class="notif-icon">✅</span><div><div class="notif-text">Buddy's daycare appointment confirmed</div><div class="notif-sub">March 5, 2026 — 08:00 AM</div></div></div>`;
</script>
</body>
</html>
