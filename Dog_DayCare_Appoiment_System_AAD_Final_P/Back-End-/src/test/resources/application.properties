spring.datasource.url=jdbc:h2:mem:pawcare_test;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT (required by JwtUtils bean)
jwt.secret=testSecretKeyForTestsOnlyPleaseChangeInProduction12345
jwt.expiration=86400000

# Disable mail auto-config (no mail server in tests)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# Disable startup test mail during tests
app.mail.startup-test.enabled=false

