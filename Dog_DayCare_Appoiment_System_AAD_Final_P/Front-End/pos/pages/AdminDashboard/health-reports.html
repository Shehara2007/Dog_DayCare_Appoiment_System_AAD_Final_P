<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Reports | Admin | PawCare</title>
    <link rel="stylesheet" href="../../../css/design-system.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
        a.active-page, button.active-page {
            background: linear-gradient(135deg, #FF8C42, #F5A623) !important;
            color: white !important; border-radius: 12px !important;
            box-shadow: 0 4px 15px rgba(255,140,66,0.45) !important;
        }
        .navbar-premium {
            background: linear-gradient(135deg, rgba(240,253,244,0.97), rgba(209,250,229,0.97)) !important;
            border-bottom: 2px solid rgba(16,185,129,0.2) !important;
        }
        .navbar-page-accent {
            display: inline-flex; align-items: center; gap: 0.4rem;
            font-size: 0.78rem; font-weight: 800; color: #065F46;
            background: rgba(16,185,129,0.12);
            padding: 0.28rem 0.85rem; border-radius: 99px;
            font-family: 'Nunito', sans-serif;
        }
        .page-header { margin-bottom: 2rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem; }
        .page-header-left h1 { font-family:'Fredoka One',cursive; font-size:2rem; color:#1e293b; margin-bottom:4px; }
        .page-header-left p { color:#94a3b8; font-weight:600; font-size:0.9rem; }
        .btn-new-report {
            background:linear-gradient(135deg,#4CAF82,#7DDDAD); color:white;
            border:none; border-radius:16px; padding:0.75rem 1.5rem;
            font-size:0.88rem; font-weight:800; font-family:'Nunito',sans-serif;
            cursor:pointer; display:flex; align-items:center; gap:0.5rem;
            box-shadow:0 6px 18px rgba(76,175,130,0.4); transition:all 0.25s ease;
            white-space:nowrap;
        }
        .btn-new-report:hover { transform:translateY(-2px) scale(1.04); box-shadow:0 10px 28px rgba(76,175,130,0.5); }

        /* Search bar */
        .search-toolbar {
            display:flex; gap:0.75rem; align-items:center; flex-wrap:wrap;
            margin-bottom:1.75rem; background:white; border-radius:18px;
            padding:1rem 1.5rem; border:2px solid #f1f5f9;
            box-shadow:0 2px 12px rgba(0,0,0,0.05);
        }
        .search-toolbar label { font-size:0.75rem; font-weight:800; color:#64748b; text-transform:uppercase; letter-spacing:0.06em; }
        .dog-search-wrap {
            display:flex; align-items:center; gap:0.5rem;
            background:#f8fafc; border:2px solid #f1f5f9; border-radius:12px;
            padding:0.5rem 0.9rem; flex:1; min-width:200px;
            transition:border-color 0.2s;
        }
        .dog-search-wrap:focus-within { border-color:#4CAF82; }
        .dog-search-wrap input {
            border:none; background:transparent; outline:none;
            font-size:0.88rem; font-family:'Nunito',sans-serif; font-weight:600;
            color:#1e293b; width:100%;
        }
        .btn-search {
            padding:0.55rem 1.3rem; border-radius:12px; font-size:0.82rem;
            font-weight:800; cursor:pointer; border:none; font-family:'Nunito',sans-serif;
            background:linear-gradient(135deg,#4CAF82,#7DDDAD); color:white;
            box-shadow:0 4px 10px rgba(76,175,130,0.35); transition:all 0.22s ease;
        }
        .btn-search:hover { transform:scale(1.04); box-shadow:0 6px 16px rgba(76,175,130,0.5); }

        /* Section title */
        .section-title { font-family:'Fredoka One',cursive; font-size:1.35rem; color:#1e293b; margin-bottom:1.5rem; }

        /* Report cards — style from reports.html reference */
        .report-cards-grid {
            display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1.5rem;
        }
        .report-card {
            background:white; border-radius:22px; overflow:hidden;
            box-shadow:0 3px 16px rgba(0,0,0,0.07);
            transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),box-shadow 0.3s ease;
            animation:slideUp 0.35s ease both;
        }
        @keyframes slideUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
        .report-card:hover { transform:translateY(-8px) scale(1.01); box-shadow:0 20px 44px rgba(0,0,0,0.13); }

        /* Coloured banner top */
        .card-banner {
            height:90px; position:relative; overflow:hidden;
            display:flex; align-items:flex-start; justify-content:space-between; padding:0.85rem 1.1rem;
        }
        .card-banner::before {
            content:'🐾 🐾 🐾 🐾 🐾 🐾 🐾 🐾';
            position:absolute; font-size:1.2rem; opacity:0.10;
            top:4px; left:0; right:0; word-break:break-all; line-height:2.2; pointer-events:none;
        }
        .card-banner::after {
            content:attr(data-bg-icon); position:absolute; right:0.8rem; bottom:-0.6rem;
            font-size:3.8rem; opacity:0.15; pointer-events:none;
        }
        .banner-good      { background:linear-gradient(135deg,#4CAF82,#7DDDAD); }
        .banner-bad       { background:linear-gradient(135deg,#F06B8A,#FF9DB5); }
        .banner-active    { background:linear-gradient(135deg,#F5A623,#FFD166); }
        .banner-friendly  { background:linear-gradient(135deg,#5B9BD5,#90CCF4); }
        .banner-dangerous { background:linear-gradient(135deg,#E11D48,#FB7185); }

        .badge-row-top { display:flex; gap:0.4rem; flex-wrap:wrap; }
        .status-pill {
            display:inline-flex; align-items:center; gap:4px;
            background:rgba(255,255,255,0.25); color:white;
            border:1px solid rgba(255,255,255,0.35);
            padding:0.25rem 0.7rem; border-radius:20px;
            font-size:0.67rem; font-weight:800; font-family:'Nunito',sans-serif;
            backdrop-filter:blur(4px);
        }
        .status-pill::before { content:'●'; font-size:0.4rem; }

        /* Floating avatar */
        .card-float-avatar {
            width:52px; height:52px; background:white; border-radius:50%;
            border:3px solid white; box-shadow:0 4px 14px rgba(0,0,0,0.14);
            position:absolute; bottom:-26px; left:1.3rem;
            display:flex; align-items:center; justify-content:center;
            font-size:1.6rem; z-index:3; transition:transform 0.3s ease;
        }
        .report-card:hover .card-float-avatar { transform:scale(1.15) rotate(-8deg); }

        .card-body { padding:2rem 1.3rem 1rem; }
        .card-dog-name { font-family:'Fredoka One',cursive; font-size:1.15rem; color:#1e293b; margin-bottom:2px; }
        .card-date { font-size:0.75rem; color:#94a3b8; font-weight:700; margin-bottom:1rem; }

        .badge-row { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem; }
        .rbadge {
            padding:0.35rem 0.85rem; border-radius:20px;
            font-size:0.72rem; font-weight:800; display:inline-flex; align-items:center; gap:4px;
        }
        .rb-good     { background:#ecfdf5; color:#047857; }
        .rb-bad      { background:#fef2f2; color:#b91c1c; }
        .rb-friendly { background:#EFF6FF; color:#2563EB; }
        .rb-active   { background:#FFF7ED; color:#c2410c; }
        .rb-dangerous{ background:#FFF1F2; color:#e11d48; }

        .report-notes-card {
            background:#f8fafc; border-radius:14px; padding:0.75rem 1rem;
            font-size:0.84rem; color:#64748b; font-style:italic; line-height:1.6;
        }

        /* Empty state */
        .empty-state { grid-column:1/-1; text-align:center; padding:5rem 2rem; color:#94a3b8; }
        .empty-emoji { font-size:3.5rem; display:block; margin-bottom:1rem; animation:float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

        /* Modal */
        .modal-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,0.45); backdrop-filter:blur(6px);
            display:none; z-index:1999; align-items:center; justify-content:center; padding:1rem;
        }
        .modal-box {
            background:white; border-radius:24px; padding:2.5rem;
            width:100%; max-width:520px; max-height:90vh; overflow-y:auto;
            box-shadow:0 24px 50px rgba(0,0,0,0.18); animation:popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes popIn { from{opacity:0;transform:scale(0.88)} to{opacity:1;transform:scale(1)} }
        .modal-icon { width:52px; height:52px; background:linear-gradient(135deg,#4CAF82,#7DDDAD); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:1.6rem; margin-bottom:0.8rem; box-shadow:0 4px 12px rgba(76,175,130,0.35); }
        .modal-box h2 { font-family:'Fredoka One',cursive; font-size:1.4rem; color:#1e293b; margin-bottom:4px; }
        .modal-box .sub { color:#94a3b8; font-size:0.85rem; font-weight:600; margin-bottom:1.8rem; }
        .field { margin-bottom:1.1rem; }
        .field label { display:block; font-size:0.75rem; font-weight:800; color:#64748b; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.35rem; }
        .field-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
        .form-input {
            width:100%; padding:0.7rem 1rem; border:2px solid #f1f5f9; border-radius:12px;
            font-size:0.9rem; font-family:'Nunito',sans-serif; font-weight:600;
            color:#1e293b; background:#fafbfc; transition:border-color 0.2s,box-shadow 0.2s;
            box-sizing:border-box;
        }
        .form-input:focus { outline:none; border-color:#4CAF82; box-shadow:0 0 0 4px rgba(76,175,130,0.15); background:white; }
        textarea.form-input { resize:vertical; }
        .modal-actions { display:flex; gap:1rem; margin-top:1.8rem; }
        .modal-confirm {
            flex:1; padding:0.85rem; background:linear-gradient(135deg,#4CAF82,#7DDDAD); color:white;
            border:none; border-radius:14px; font-size:0.92rem; font-weight:800;
            font-family:'Nunito',sans-serif; cursor:pointer;
            box-shadow:0 6px 16px rgba(76,175,130,0.4); transition:all 0.25s ease;
        }
        .modal-confirm:hover { transform:translateY(-2px) scale(1.02); }
        .modal-cancel {
            flex:1; padding:0.85rem; background:#f1f5f9; color:#64748b;
            border:none; border-radius:14px; font-size:0.92rem; font-weight:800;
            font-family:'Nunito',sans-serif; cursor:pointer; transition:all 0.2s ease;
        }
        .modal-cancel:hover { background:#e2e8f0; }
        @media(max-width:768px){ .report-cards-grid{grid-template-columns:1fr;} .field-row{grid-template-columns:1fr;} }
    </style>
</head>
<body>
<div class="app-container">
    <main class="main-content-premium">
        <div id="reportNotice" class="notice"></div>
        <div class="page-header">
            <div class="page-header-left">
                <h1 class="text-gradient">Health & Behaviour Logs 🏥</h1>
                <p>Monitor and record wellbeing metrics for all dogs.</p>
            </div>
            <button id="addReportBtn" class="btn-new-report">📋 New Health Report</button>
        </div>

        <div class="search-toolbar">
            <label>🐾 Select Dog:</label>
            <div class="dog-search-wrap">
                <input type="text" id="dogSearchInput" list="dogDatalist" placeholder="Search by name or ID…">
                <datalist id="dogDatalist"></datalist>
            </div>
            <button id="searchBtn" class="btn-search">View Reports</button>
        </div>

        <div class="section-title" id="reportListTitle">Health & Behaviour Records</div>

        <div class="report-cards-grid" id="reportCardsGrid">
            <div class="empty-state">
                <span class="empty-emoji">🦴</span>
                <p style="font-weight:700">Search for a dog to see their reports</p>
            </div>
        </div>
        <table style="display:none"><tbody id="reportList"></tbody></table>
    </main>
</div>

<!-- Add Report Modal -->
<div class="modal-overlay" id="addReportModal">
    <div class="modal-box">
        <div class="modal-icon">📋</div>
        <h2>Create Health Report</h2>
        <p class="sub">Log today's health & behaviour observation.</p>
        <form id="addReportForm">
            <div class="field">
                <label>Tag Dog</label>
                <select id="rptDogSelect" class="form-input" required>
                    <option value="">Choose a dog…</option>
                </select>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Behaviour</label>
                    <select id="rptBehaviour" class="form-input" required>
                        <option value="FRIENDLY">😊 Friendly</option>
                        <option value="ACTIVE">⚡ Active</option>
                        <option value="DANGEROUS">⚠️ Dangerous</option>
                    </select>
                </div>
                <div class="field">
                    <label>Health Status</label>
                    <select id="rptHealth" class="form-input" required>
                        <option value="GOOD">✅ Good</option>
                        <option value="BAD">⚠️ Bad</option>
                    </select>
                </div>
            </div>
            <div class="field">
                <label>Detailed Notes</label>
                <textarea id="rptNotes" class="form-input" rows="4"
                          placeholder="Mention any observations, mood, or eating habits…"></textarea>
            </div>
            <div class="modal-actions">
                <button type="submit" class="modal-confirm">📋 Post Report</button>
                <button type="button" id="closeModalBtn" class="modal-cancel">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script src="../../../lib/jquery-3.7.1.min.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/notification.js"></script>
<script src="../../js/layout.js"></script>
<script>
    $(document).ready(function () {
        DogDaycareLayout.init();
        const session = DogDaycareAuth.getSession();
        if (!session || session.role !== 'ADMIN') {
            window.location.href = DogDaycareLayout.relPath + 'login.html'; return;
        }
        const curr = location.pathname.split('/').pop();
        $('a').each(function(){ if($(this).attr('href')&&$(this).attr('href').split('/').pop().split('?')[0]===curr) $(this).addClass('active-page'); });
        const $navbar = $('.navbar-premium');
        if ($navbar.length) { $navbar.find('.navbar-page-accent').remove(); $navbar.append('<span class="navbar-page-accent">🏥 Health Reports</span>'); }

        let dogCache = {};
        const DOG_ICONS = ['🐶','🐕','🦮','🐩','🐾','🐕‍🦺'];
        function dogIcon(id) { return DOG_ICONS[(id||0) % DOG_ICONS.length]; }

        function healthTopClass(h, b) {
            if (h === 'BAD') return 'top-bad';
            if (b === 'DANGEROUS') return 'top-dangerous';
            if (b === 'ACTIVE') return 'top-active';
            if (b === 'FRIENDLY') return 'top-friendly';
            return 'top-good';
        }
        function healthTopIcon(h) { return h === 'BAD' ? '🤒' : '💚'; }
        function bannerClass(h, b) {
            if (h==='BAD') return 'banner-bad';
            if (b==='DANGEROUS') return 'banner-dangerous';
            if (b==='ACTIVE') return 'banner-active';
            if (b==='FRIENDLY') return 'banner-friendly';
            return 'banner-good';
        }
        function bpClass(val) {
            const m = { GOOD:'rb-good', BAD:'rb-bad', FRIENDLY:'rb-friendly', ACTIVE:'rb-active', DANGEROUS:'rb-dangerous' };
            return m[val] || 'rb-good';
        }
        function bpIcon(val) {
            const m = { GOOD:'✅', BAD:'⚠️', FRIENDLY:'😊', ACTIVE:'⚡', DANGEROUS:'🚨' };
            return m[val] || '🐾';
        }

        function renderCards(reports, dogId) {
            const $grid = $('#reportCardsGrid'); $grid.empty();
            if (!reports.length) {
                $grid.html('<div class="empty-state"><span class="empty-emoji">🐾</span><p style="font-weight:700">No health records found for this dog.</p></div>');
                return;
            }
            const dogName = dogCache[dogId] || `Dog #${dogId}`;
            $('#reportListTitle').text(`Reports for ${dogName} (${reports.length})`);
            reports.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).forEach((rpt,i) => {
                const dateStr = new Date(rpt.createdAt).toLocaleDateString();
                const icon = dogIcon(dogId);
                const bgIcon = healthTopIcon(rpt.healthStatus);
                const bCls = bannerClass(rpt.healthStatus, rpt.behaviour);
                $grid.append(`
                <div class="report-card" style="animation-delay:${i*0.07}s">
                    <div class="card-banner ${bCls}" data-bg-icon="${bgIcon}">
                        <div class="badge-row-top">
                            <span class="status-pill">${rpt.healthStatus}</span>
                            <span class="status-pill">${rpt.behaviour}</span>
                        </div>
                    </div>
                    <div class="card-float-avatar">${icon}</div>
                    <div class="card-body">
                        <div class="card-dog-name">${dogName}</div>
                        <div class="card-date">📅 ${dateStr}</div>
                        <div class="badge-row">
                            <span class="rbadge ${bpClass(rpt.healthStatus)}">${bpIcon(rpt.healthStatus)} ${rpt.healthStatus}</span>
                            <span class="rbadge ${bpClass(rpt.behaviour)}">${bpIcon(rpt.behaviour)} ${rpt.behaviour}</span>
                        </div>
                        ${rpt.notes ? `<div class="report-notes-card">📝 ${rpt.notes}</div>` : ''}
                    </div>
                </div>`);
            });
        }

        function loadDogs() {
            DogDaycareAuth.request('GET', '/api/v1/dogs').then(dogs => {
                const $select = $('#rptDogSelect');
                const $datalist = $('#dogDatalist');
                $select.find('option:not(:first)').remove();
                $datalist.empty();
                dogs.forEach(dog => {
                    dogCache[dog.id] = dog.name;
                    $select.append(`<option value="${dog.id}">${dog.name} (ID: ${dog.id})</option>`);
                    $datalist.append(`<option value="${dog.name}" data-id="${dog.id}">ID: ${dog.id}</option>`);
                });
            });
        }

        function loadReports(dogId) {
            if (!dogId) return;
            $('#reportCardsGrid').html('<div class="empty-state"><span class="empty-emoji" style="animation:none">⏳</span><p style="font-weight:700">Fetching logs…</p></div>');
            DogDaycareAuth.getHealthReportsByDog(dogId).then(reports => {
                renderCards(reports, dogId);
            });
        }

        loadDogs();

        $('#searchBtn').on('click', function () {
            const searchValue = $('#dogSearchInput').val();
            const $opt = $(`#dogDatalist option[value="${searchValue}"]`);
            let dogId = $opt.length ? $opt.data('id') : null;
            if (!dogId && !isNaN(searchValue)) dogId = Number(searchValue);
            if (dogId) { loadReports(dogId); }
            else { alert('Please select a valid dog.'); }
        });

        $('#addReportBtn').on('click', () => $('#addReportModal').css('display', 'flex').hide().fadeIn());
        $('#closeModalBtn').on('click', () => $('#addReportModal').fadeOut());

        $('#addReportForm').on('submit', function (e) {
            e.preventDefault();
            const payload = {
                dogId: Number($('#rptDogSelect').val()),
                createdById: session.userId,
                behaviour: $('#rptBehaviour').val(),
                healthStatus: $('#rptHealth').val(),
                notes: $('#rptNotes').val()
            };
            DogDaycareAuth.createHealthReport(payload).then(() => {
                $('#reportNotice').text('Health report published!').removeClass('notice-error').addClass('notice-success').fadeIn();
                $('#addReportModal').fadeOut();
                $('#addReportForm')[0].reset();
                loadReports(payload.dogId);
                setTimeout(() => $('#reportNotice').fadeOut(), 3000);
            }).fail(xhr => {
                const msg = xhr.responseJSON ? xhr.responseJSON.message : 'Error creating report';
                $('#reportNotice').text(msg).removeClass('notice-success').addClass('notice-error').fadeIn();
            });
        });

        $(document).on('keydown', e => { if (e.key === 'Escape') $('#addReportModal').fadeOut(); });
    });
</script>
</body>
</html>
