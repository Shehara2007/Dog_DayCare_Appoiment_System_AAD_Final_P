<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Reports | PawCare</title>
    <link rel="stylesheet" href="../../../css/design-system.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }

        a.active-page, button.active-page {
            background: linear-gradient(135deg, #FF8C42, #F5A623) !important;
            color: white !important;
            border-radius: 12px !important;
            box-shadow: 0 4px 15px rgba(255,140,66,0.45) !important;
        }

        /* Dog filter styled nicely */
        .filter-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.8rem; padding: 0 0.5rem;
        }
        .filter-select {
            padding: 0.6rem 1.2rem;
            border: 2px solid #f1f5f9;
            border-radius: 14px;
            font-size: 0.88rem; font-weight: 700;
            font-family: 'Nunito', sans-serif;
            color: #1e293b; background: white;
            min-width: 200px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .filter-select:focus { outline: none; border-color: #FF8C42; }

        /* Report cards instead of boring table */
        .report-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .report-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 3px 16px rgba(0,0,0,0.07);
            border-left: 5px solid #e2e8f0;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            animation: slideUp 0.35s ease both;
        }
        .report-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }
        @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

        .report-card.health-good { border-left-color: #4CAF82; }
        .report-card.health-bad  { border-left-color: #F06B8A; }
        .report-card.health-warn { border-left-color: #F5A623; }

        .report-card-top {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 1.1rem;
        }
        .report-dog-info { display: flex; align-items: center; gap: 0.75rem; }
        .report-dog-icon {
            width: 42px; height: 42px;
            background: #f8fafc; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
        }
        .report-dog-name { font-family: 'Fredoka One', cursive; font-size: 1.1rem; color: #1e293b; }
        .report-date { font-size: 0.75rem; color: #94a3b8; font-weight: 700; margin-top: 2px; }

        .report-date-right { text-align: right; }
        .report-date-right .rdate { font-size: 0.82rem; font-weight: 700; color: #64748b; }
        .report-date-right .rtime { font-size: 0.72rem; color: #94a3b8; margin-top: 2px; }

        .badge-row { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .rbadge {
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-size: 0.72rem; font-weight: 800;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .rb-good    { background: #ecfdf5; color: #047857; }
        .rb-warn    { background: #fffbeb; color: #b45309; }
        .rb-error   { background: #fef2f2; color: #b91c1c; }
        .rb-friendly { background: #EFF6FF; color: #2563EB; }
        .rb-active   { background: #FFF7ED; color: #c2410c; }
        .rb-energetic{ background: #F5F3FF; color: #7c3aed; }

        .report-notes {
            font-size: 0.85rem; color: #64748b;
            line-height: 1.6;
            background: #f8fafc;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-style: italic;
        }
        .report-notes.no-notes { color: #cbd5e1; }

        /* Empty / loading state */
        .empty-state {
            grid-column: 1/-1;
            text-align: center; padding: 5rem 2rem; color: #94a3b8;
        }
        .empty-emoji { font-size: 3.5rem; display: block; margin-bottom: 1rem; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    </style>
</head>
<body>
<div class="app-container">
    <main class="main-content-premium">
        <div id="reportNotice" class="notice"></div>
        <header style="margin-bottom: 2.5rem;">
            <h1 class="text-gradient" style="font-family:'Fredoka One',cursive;font-size:2rem;">Health & Behaviour Reports 🩺</h1>
            <p style="color:var(--text-muted);font-weight:600;">Stay updated with your pet's well-being and daily logs.</p>
        </header>

        <div class="filter-bar">
            <h2 style="font-size:1.3rem;margin:0;font-family:'Fredoka One',cursive;">Pet Activity Logs</h2>
            <div style="display:flex;align-items:center;gap:0.75rem;">
                <span style="color:#94a3b8;font-size:0.85rem;font-weight:700;">🔍 Filter:</span>
                <select id="dogFilter" class="filter-select">
                    <option value="">All Family Members</option>
                </select>
            </div>
        </div>

        <div class="report-cards" id="reportCards">
            <div class="empty-state">
                <span class="empty-emoji">🦴</span>
                <p style="font-weight:700;">Select a dog to view their health reports</p>
            </div>
        </div>
    </main>
</div>

<script src="../../../lib/jquery-3.7.1.min.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/notification.js"></script>
<script src="../../js/layout.js"></script>
<script>
    $(document).ready(function() {
        DogDaycareLayout.init();
        const session = DogDaycareAuth.getSession();
        if (!session) { window.location.href = DogDaycareLayout.relPath + 'login.html'; return; }

        const curr = location.pathname.split('/').pop();
        $('a').each(function(){
            if($(this).attr('href')&&$(this).attr('href').split('/').pop().split('?')[0]===curr)
                $(this).addClass('active-page');
        });

        const urlParams = new URLSearchParams(window.location.search);
        const initialDogId = urlParams.get('dogId');

        DogDaycareAuth.getDogsByOwner(session.userId).then(dogs => {
            const $f = $('#dogFilter');
            dogs.forEach(dog => {
                $f.append(`<option value="${dog.id}" ${dog.id==initialDogId?'selected':''}>${dog.name}</option>`);
            });
            if (initialDogId) loadReports(initialDogId);
            else if (dogs.length > 0) { /* optional: load first */ }
        });

        $('#dogFilter').on('change', function() {
            const id = $(this).val();
            if (id) loadReports(id);
            else $('#reportCards').html('<div class="empty-state"><span class="empty-emoji">🦴</span><p style="font-weight:700">Select a dog above</p></div>');
        });

        function getBehaviourBadge(b) {
            if (!b) return '';
            const map = {
                'FRIENDLY': {cls:'rb-friendly', icon:'😊'},
                'ACTIVE':   {cls:'rb-active',   icon:'⚡'},
                'AGGRESSIVE':{cls:'rb-error',    icon:'😤'},
                'ENERGETIC':{cls:'rb-energetic', icon:'🌟'},
            };
            const m = map[b] || {cls:'rb-warn', icon:'🐾'};
            return `<span class="rbadge ${m.cls}">${m.icon} ${b}</span>`;
        }

        function getHealthBadge(h) {
            if (!h) return '';
            if (h === 'GOOD') return `<span class="rbadge rb-good">✅ GOOD</span>`;
            return `<span class="rbadge rb-error">⚠️ ${h}</span>`;
        }

        function loadReports(dogId) {
            $('#reportCards').html('<div class="empty-state"><span class="empty-emoji" style="animation:none">⏳</span><p style="font-weight:700">Loading reports...</p></div>');
            DogDaycareAuth.getHealthReportsByDog(dogId).then(reports => {
                const $c = $('#reportCards');
                $c.empty();
                if (!reports.length) {
                    $c.html('<div class="empty-state"><span class="empty-emoji">🐾</span><p style="font-weight:700">No reports found yet.</p><p style="font-size:0.85rem">Reports will appear after daycare visits.</p></div>');
                    return;
                }
                reports.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).forEach((rpt,i)=>{
                    const d = new Date(rpt.createdAt);
                    const hCls = rpt.healthStatus==='GOOD' ? 'health-good' : 'health-bad';
                    $c.append(`
                            <div class="report-card ${hCls}" style="animation-delay:${i*0.07}s">
                                <div class="report-card-top">
                                    <div class="report-dog-info">
                                        <div class="report-dog-icon">🦴</div>
                                        <div>
                                            <div class="report-dog-name">${rpt.dogName||'Pet '+dogId}</div>
                                            <div class="report-date">Health & Behaviour Report</div>
                                        </div>
                                    </div>
                                    <div class="report-date-right">
                                        <div class="rdate">${d.toLocaleDateString()}</div>
                                        <div class="rtime">${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>
                                    </div>
                                </div>
                                <div class="badge-row">
                                    ${getHealthBadge(rpt.healthStatus)}
                                    ${getBehaviourBadge(rpt.behaviour)}
                                </div>
                                <div class="report-notes ${rpt.notes?'':'no-notes'}">
                                    ${rpt.notes ? '📝 ' + rpt.notes : '— No additional notes provided.'}
                                </div>
                            </div>`);
                });
            });
        }
    });
</script>
</body>
</html>
