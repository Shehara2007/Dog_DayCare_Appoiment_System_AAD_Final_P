<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dogs | PawCare</title>
    <link rel="stylesheet" href="../../../css/design-system.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        :root {
            --paw-orange: #FF8C42;
            --paw-gold: #F5A623;
            --paw-dark: #2D1B0E;
            --paw-warm: #FFF3E8;
        }
        body { font-family: 'Nunito', sans-serif; }

        /* Active nav highlight */
        a.active-page, button.active-page {
            background: linear-gradient(135deg, #FF8C42, #F5A623) !important;
            color: white !important;
            border-radius: 12px !important;
            box-shadow: 0 4px 15px rgba(255,140,66,0.45) !important;
        }

        .dog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .dog-card {
            border-radius: 24px;
            overflow: hidden;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.35s ease;
        }
        .dog-card:hover {
            transform: translateY(-10px) scale(1.015);
            box-shadow: 0 24px 50px rgba(0,0,0,0.15);
        }

        .dog-card-banner {
            height: 140px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .dog-card-banner::before {
            content: '🐾 🐾 🐾 🐾 🐾 🐾 🐾 🐾 🐾 🐾';
            position: absolute;
            font-size: 1.5rem;
            opacity: 0.13;
            top: 8px; left: -5px; right: -5px;
            word-break: break-all;
            line-height: 2.4;
            pointer-events: none;
        }

        .card-c0 .dog-card-banner { background: linear-gradient(135deg,#5B9BD5,#90CCF4); }
        .card-c1 .dog-card-banner { background: linear-gradient(135deg,#F5A623,#FFD166); }
        .card-c2 .dog-card-banner { background: linear-gradient(135deg,#4CAF82,#7DDDAD); }
        .card-c3 .dog-card-banner { background: linear-gradient(135deg,#9B7DD4,#C3A9F0); }
        .card-c4 .dog-card-banner { background: linear-gradient(135deg,#F06B8A,#FF9DB5); }
        .card-c5 .dog-card-banner { background: linear-gradient(135deg,#FF8C42,#FFBE80); }

        .dog-float-avatar {
            width: 86px; height: 86px;
            background: white;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            position: absolute;
            bottom: -43px; left: 50%;
            transform: translateX(-50%);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem;
            z-index: 3;
            transition: transform 0.3s ease;
            overflow: hidden;
        }
        .dog-card:hover .dog-float-avatar {
            transform: translateX(-50%) scale(1.12) rotate(-6deg);
        }
        .dog-float-avatar img {
            width: 100%; height: 100%;
            object-fit: cover; border-radius: 50%;
        }

        .health-badge {
            position: absolute; top: 10px; right: 10px;
            background: rgba(255,255,255,0.92);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.7rem; font-weight: 800;
            backdrop-filter: blur(4px); z-index: 5;
            color: #047857;
        }

        .dog-card-body {
            padding: 3.5rem 1.5rem 1rem;
            text-align: center;
        }
        .dog-card-body h3 {
            font-family: 'Fredoka One', cursive;
            font-size: 1.55rem;
            color: #1e293b;
            margin-bottom: 3px;
        }
        .breed-line {
            font-size: 0.82rem; color: #94a3b8;
            font-weight: 600; margin-bottom: 1.2rem;
        }

        .dog-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.55rem; margin-bottom: 1rem;
        }
        .stat-pill {
            background: #f8fafc;
            border-radius: 12px;
            padding: 0.55rem 0.75rem;
            text-align: left;
        }
        .stat-label { font-size: 0.62rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
        .stat-value { font-size: 0.9rem; color: #1e293b; font-weight: 800; margin-top: 2px; }

        .action-row {
            display: flex; gap: 0.5rem;
            padding: 0 1.2rem 0.75rem;
        }
        .dog-card-footer {
            padding: 0 1.2rem 1.2rem;
            display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem;
        }

        .cta-btn {
            padding: 0.6rem 0.5rem;
            border-radius: 12px;
            font-size: 0.8rem; font-weight: 800;
            font-family: 'Nunito', sans-serif;
            cursor: pointer; border: none;
            text-align: center; text-decoration: none;
            display: flex; align-items: center; justify-content: center; gap: 4px;
            transition: all 0.2s ease;
        }
        .cta-btn:hover { transform: scale(1.05); }
        .cta-primary { background: linear-gradient(135deg,#FF8C42,#F5A623); color: white; box-shadow: 0 4px 12px rgba(255,140,66,0.35); flex:1; }
        .cta-secondary { background: #f1f5f9; color: #475569; flex:1; }
        .cta-edit { background: #EFF6FF; color: #2563EB; flex:1; }
        .cta-del { background: #FFF1F2; color: #e11d48; flex:1; }

        /* ADD DOG BTN */
        .top-add-btn {
            background: linear-gradient(135deg,#FF8C42,#F5A623);
            color: white; border: none; border-radius: 16px;
            padding: 0.75rem 1.5rem;
            font-size: 0.92rem; font-weight: 800;
            font-family: 'Nunito', sans-serif;
            cursor: pointer;
            display: flex; align-items: center; gap: 0.5rem;
            box-shadow: 0 6px 20px rgba(255,140,66,0.4);
            transition: all 0.25s ease;
        }
        .top-add-btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 10px 28px rgba(255,140,66,0.5); }

        /* MODALS */
        .modal-overlay {
            position: fixed; top:0; left:0; right:0; bottom:0;
            background: rgba(10,5,0,0.55);
            backdrop-filter: blur(10px);
            display: none; z-index: 2100;
            align-items: center; justify-content: center;
            padding: 1.5rem;
        }
        .modal-box {
            width: 100%; max-width: 460px;
            background: white; border-radius: 28px;
            padding: 2.5rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.25);
            animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes popIn { from{transform:scale(0.85) translateY(20px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }

        .modal-icon-wrap {
            width: 60px; height: 60px;
            background: #FFF3E8; border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.9rem; margin-bottom: 1.1rem;
        }
        .modal-box h2 { font-family:'Fredoka One',cursive; font-size:1.5rem; color:#1e293b; margin-bottom:3px; }
        .modal-box p.sub { color:#94a3b8; font-size:0.88rem; margin-bottom:1.8rem; }

        .field { margin-bottom: 1.1rem; }
        .field label { display:block; font-size:0.75rem; font-weight:800; color:#64748b; text-transform:uppercase; letter-spacing:0.06em; margin-bottom:0.35rem; }
        .field input {
            width:100%; padding:0.7rem 1rem;
            border:2px solid #f1f5f9; border-radius:12px;
            font-size:0.92rem; font-family:'Nunito',sans-serif; font-weight:600;
            color:#1e293b; background:#fafbfc;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing:border-box;
        }
        .field input:focus { outline:none; border-color:#FF8C42; box-shadow:0 0 0 4px rgba(255,140,66,0.12); background:white; }

        .modal-actions { display:flex; gap:0.75rem; margin-top:1.8rem; }
        .modal-cta {
            flex:1; padding:0.82rem; border-radius:14px;
            font-size:0.9rem; font-weight:800;
            font-family:'Nunito',sans-serif;
            cursor:pointer; border:none; transition:all 0.2s;
        }
        .modal-cta:hover { transform:scale(1.03); }
        .modal-confirm { background:linear-gradient(135deg,#FF8C42,#F5A623); color:white; box-shadow:0 5px 15px rgba(255,140,66,0.35); }
        .modal-cancel { background:#f1f5f9; color:#64748b; }

        .empty-state { grid-column:1/-1; text-align:center; padding:5rem 2rem; color:#94a3b8; }
        .empty-emoji { font-size:3.5rem; display:block; margin-bottom:1rem; animation:float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
        @keyframes popIn { from{transform:scale(0.8) translateY(20px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }
    </style>
</head>
<body>
<div class="app-container">
    <main class="main-content-premium">
        <div id="dogNotice" class="notice"></div>
        <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2.5rem;">
            <div>
                <h1 class="text-gradient" style="font-family:'Fredoka One',cursive;font-size:2rem;">My Dogs 🐾</h1>
                <p style="color:var(--text-muted);font-weight:600;">Manage your furry family members here.</p>
            </div>
            <button id="addDogBtn" class="top-add-btn">
                <span style="font-size:1.3rem;">+</span> Register New Dog
            </button>
        </header>
        <div class="dog-grid" id="dogGrid">
            <div class="empty-state"><span class="empty-emoji">🐕</span><p style="font-weight:700;">Loading your furry friends...</p></div>
        </div>
    </main>
</div>

<!-- Add Dog Modal -->
<div class="modal-overlay" id="addDogModal">
    <div class="modal-box">
        <div class="modal-icon-wrap">🐶</div>
        <h2>Register New Pet</h2>
        <p class="sub">Help us get to know your furry family member!</p>
        <form id="addDogForm">
            <div class="field"><label>Dog's Name</label><input type="text" id="dogName" placeholder="e.g. Buddy" required></div>
            <div class="field"><label>Breed</label><input type="text" id="dogBreed" placeholder="e.g. Golden Retriever" required></div>
            <div class="field"><label>Date of Birth</label><input type="date" id="dogDob"></div>
            <div class="modal-actions">
                <button type="submit" class="modal-cta modal-confirm">🐾 Register Pet</button>
                <button type="button" class="modal-cta modal-cancel closeModalBtn">Cancel</button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Dog Modal -->
<div class="modal-overlay" id="editDogModal">
    <div class="modal-box">
        <div class="modal-icon-wrap">✏️</div>
        <h2>Update Pet Profile</h2>
        <p class="sub">Keep your pet's information up to date.</p>
        <form id="editDogForm">
            <input type="hidden" id="editDogId">
            <div class="field"><label>Dog Name</label><input type="text" id="editDogName" required></div>
            <div class="field"><label>Breed</label><input type="text" id="editDogBreed" required></div>
            <div class="field"><label>Date of Birth</label><input type="date" id="editDogDob" required></div>
            <div class="modal-actions">
                <button type="submit" class="modal-cta modal-confirm">💾 Save Changes</button>
                <button type="button" class="modal-cta modal-cancel closeModalBtn">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script src="../../../lib/jquery-3.7.1.min.js"></script>
<script src="../../js/auth.js"></script>
<script src="../../js/notification.js"></script>
<script src="../../js/layout.js"></script>
<script>
    const EMOJIS = ['🐶','🦮','🐩','🐕‍🦺','🐕','🦴','🐾','🐶','🐕'];

    $(document).ready(function() {
        DogDaycareLayout.init();
        const session = DogDaycareAuth.getSession();
        if (!session) { window.location.href = DogDaycareLayout.relPath + 'login.html'; return; }

        // Highlight active nav link
        const curr = location.pathname.split('/').pop();
        $('a').each(function(){
            if($(this).attr('href') && $(this).attr('href').split('/').pop().split('?')[0] === curr)
                $(this).addClass('active-page');
        });

        function calcAge(dob) {
            if (!dob) return 'N/A';
            const diff = Date.now() - new Date(dob).getTime();
            const yrs = Math.floor(diff / (1000*60*60*24*365.25));
            if (yrs < 1) { const mo = Math.floor(diff/(1000*60*60*24*30.44)); return mo+'mo'; }
            return yrs+'yr'+(yrs!==1?'s':'');
        }

        function loadDogs() {
            DogDaycareAuth.getDogsByOwner(session.userId).then(dogs => {
                const $g = $('#dogGrid');
                $g.empty();
                if (!dogs.length) {
                    $g.append('<div class="empty-state"><span class="empty-emoji">🐾</span><p style="font-size:1.1rem;font-weight:700;">No furry friends yet!</p><p>Register your first dog above 🐶</p></div>');
                    return;
                }
                dogs.sort((a,b)=>b.id-a.id).forEach((dog,i)=>{
                    const cls = `card-c${i%6}`;
                    const avatar = dog.qrCodeBase64
                        ? `<img src="data:image/png;base64,${dog.qrCodeBase64}" title="ID:${dog.id}">`
                        : `<span>${EMOJIS[i%EMOJIS.length]}</span>`;
                    $g.append(`
                            <div class="dog-card ${cls}" style="animation:popIn 0.4s ${i*0.08}s both cubic-bezier(0.34,1.56,0.64,1)">
                                <div class="dog-card-banner">
                                    <div class="health-badge">✅ Active</div>
                                    <div class="dog-float-avatar">${avatar}</div>
                                </div>
                                <div class="dog-card-body">
                                    <h3>${dog.name}</h3>
                                    <div class="breed-line">${dog.breed||'Mixed Breed'} · ${calcAge(dog.dateOfBirth)}</div>
                                    <div class="dog-stats">
                                        <div class="stat-pill">
                                            <div class="stat-label">🎂 Age</div>
                                            <div class="stat-value">${calcAge(dog.dateOfBirth)}</div>
                                        </div>
                                        <div class="stat-pill">
                                            <div class="stat-label">🐕 Breed</div>
                                            <div class="stat-value" style="font-size:0.78rem">${dog.breed||'—'}</div>
                                        </div>
                                    </div>
                                </div>
                                <div class="action-row">
                                    <button onclick='editDog(${JSON.stringify(dog).replace(/"/g,"&quot;")})' class="cta-btn cta-edit">✏️ Edit</button>
                                    <button onclick="confirmDelete(${dog.id},'${dog.name}')" class="cta-btn cta-del">🗑️ Remove</button>
                                </div>
                                <div class="dog-card-footer">
                                    <a href="darecare-appointments.html?dogId=${dog.id}" class="cta-btn cta-primary">🏠 Book Daycare</a>
                                    <a href="reports.html?dogId=${dog.id}" class="cta-btn cta-secondary">📋 Reports</a>
                                </div>
                            </div>`);
                });
            }).fail(()=>{
                $('#dogGrid').html('<div class="empty-state" style="color:#e11d48">❌ Failed to load pets.</div>');
            });
        }

        loadDogs();

        $('#addDogBtn').on('click',()=>$('#addDogModal').css('display','flex').hide().fadeIn(200));
        $('.closeModalBtn').on('click',()=>$('.modal-overlay').fadeOut(200));

        $('#addDogForm').on('submit',function(e){
            e.preventDefault();
            const p={name:$('#dogName').val(),breed:$('#dogBreed').val(),dateOfBirth:$('#dogDob').val(),ownerId:session.userId};
            DogDaycareAuth.createDog(p).then(()=>{
                $('#dogNotice').text('🐾 Welcome, '+p.name+'!').addClass('notice-success').fadeIn();
                $('#addDogModal').fadeOut(200); $('#addDogForm')[0].reset(); loadDogs();
                setTimeout(()=>$('#dogNotice').fadeOut(),3500);
            }).fail(xhr=>$('#dogNotice').text(xhr.responseJSON?.message||'Error').addClass('notice-error').fadeIn());
        });

        window.editDog=function(dog){
            $('#editDogId').val(dog.id);$('#editDogName').val(dog.name);
            $('#editDogBreed').val(dog.breed);$('#editDogDob').val(dog.dateOfBirth);
            $('#editDogModal').css('display','flex').hide().fadeIn(200);
        };

        window.confirmDelete=function(id,name){
            if(confirm(`Remove ${name}? This cannot be undone.`)){
                DogDaycareAuth.deleteDog(id).then(()=>{
                    $('#dogNotice').text('👋 '+name+' removed.').addClass('notice-success').fadeIn();
                    loadDogs(); setTimeout(()=>$('#dogNotice').fadeOut(),3000);
                });
            }
        };

        $('#editDogForm').on('submit',function(e){
            e.preventDefault();
            const p={name:$('#editDogName').val(),breed:$('#editDogBreed').val(),dateOfBirth:$('#editDogDob').val(),ownerId:Number(session.userId)};
            DogDaycareAuth.updateDog($('#editDogId').val(),p).then(()=>{
                $('#dogNotice').text('✅ Profile updated!').addClass('notice-success').fadeIn();
                $('#editDogModal').fadeOut(200); loadDogs();
                setTimeout(()=>$('#dogNotice').fadeOut(),3000);
            });
        });

        $(document).on('keydown',e=>{if(e.key==='Escape')$('.modal-overlay').fadeOut(200);});
    });
</script>
</body>
</html>
